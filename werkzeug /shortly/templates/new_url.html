<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortly - New URL</title>
</head>
<body>
    <h1>Shortly - New URL</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input type="text" name="url" value="{{ url }}" placeholder="Enter URL" required>
        <button type="submit">Shorten</button>
    </form>
</body>
</html>
